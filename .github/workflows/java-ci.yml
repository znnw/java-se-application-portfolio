name: Java CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compile:
    name: Compile application tracks
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Resolve dependencies
        run: mvn --batch-mode dependency:copy-dependencies -DoutputDirectory=build/lib -DincludeScope=test

      - name: Compile modules
        shell: bash
        run: |
          set -euo pipefail
          LOMBOK=build/lib/lombok-1.18.42.jar
          DEPENDENCIES='build/lib/*'

          compile() {
            local output="$1"
            shift
            mkdir -p "$output"
            find "$@" -name '*.java' -print0 \
              | xargs -0 javac \
                  -encoding UTF-8 \
                  -cp "$DEPENDENCIES" \
                  -processorpath "$LOMBOK" \
                  -d "$output"
          }

          compile build/day01 java-rumeng/javaseAIproject/day01-hd-app/src
          compile build/day02 java-rumeng/javaseAIproject/day02-basic-app/src
          compile build/day03 java-rumeng/javaseAIproject/day03-flow-control/src
          compile build/day04 java-rumeng/javaseAIproject/day04-oop/src
          compile build/day05 java-rumeng/javaseAIproject/day05-oopGaoJi/src
          compile build/day06 java-rumeng/javaseAIproject/day06-oopGaoJi2/src
          compile build/employee java-rumeng/javaseAIproject/heima-employee-system/src
          compile build/stone-maze java-rumeng/javaseAIproject/stone-maze/src

          compile build/day09 java-rumeng/javaseprojectaimax/day09-collection
          compile build/day10 java-rumeng/javaseprojectaimax/day10-collection-map-stream/src
          compile build/day11 java-rumeng/javaseprojectaimax/day11-Stream/src
          compile build/day12 java-rumeng/javaseprojectaimax/day12-file-io/src
          compile build/day13 java-rumeng/javaseprojectaimax/day13-thread/src
          compile build/day14 java-rumeng/javaseprojectaimax/day14-ExcutorService/src
          compile build/day15 java-rumeng/javaseprojectaimax/day15-net/src
          compile build/day16 java-rumeng/javaseprojectaimax/day16-GaoJi/src

          compile build/chat \
            java-rumeng/javaseprojectaimax/ithiema-chat-server/src \
            java-rumeng/javaseprojectaimax/itheima-chat-system/src

      - name: Run smoke test
        shell: bash
        run: java -cp build/day10 Map.MapTravelse
